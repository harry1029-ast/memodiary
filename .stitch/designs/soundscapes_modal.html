<!-- BEGIN: Interactive Switcher Script -->
<script data-purpose="sound-interaction">
    document.addEventListener('DOMContentLoaded', () => {
      const labels = document.querySelectorAll('fieldset[data-purpose="sound-selection-options"] label');
      
      labels.forEach(label => {
        label.addEventListener('click', () => {
          // Reset all options to unselected style
          labels.forEach(l => {
            l.className = "group relative flex items-center justify-between p-3 rounded-2xl bg-rice-100/50 border border-ink-100 hover:border-ink-300/60 cursor-pointer transition-all hover:bg-rice-100/80";
            const radioIndicator = l.querySelector('.rounded-full.border-2');
            const innerDot = radioIndicator ? radioIndicator.querySelector('div') : null;
            if (radioIndicator) {
              radioIndicator.className = "w-5 h-5 rounded-full border-2 border-ink-300 flex items-center justify-center flex-shrink-0";
            }
            if (innerDot) {
              innerDot.className = "w-2.5 h-2.5 rounded-full bg-transparent";
            }
            const stamp = l.querySelector('.font-calligraphy');
            if (stamp) {
              stamp.classList.remove('text-cinnabar', 'opacity-80');
              stamp.classList.add('text-ink-300');
            }
          });

          // Apply selected Cinnabar Ink style to clicked option
          label.className = "group relative flex items-center justify-between p-3 rounded-2xl bg-rice-50 border border-cinnabar/40 shadow-sm cursor-pointer transition-all hover:bg-white/80";
          const currentRadio = label.querySelector('.rounded-full.border-2');
          const currentDot = currentRadio ? currentRadio.querySelector('div') : null;
          if (currentRadio) {
            currentRadio.className = "w-5 h-5 rounded-full border-2 border-cinnabar flex items-center justify-center flex-shrink-0";
          }
          if (currentDot) {
            currentDot.className = "w-2.5 h-2.5 rounded-full bg-cinnabar";
          }
          const activeStamp = label.querySelector('.font-calligraphy');
          if (activeStamp) {
            activeStamp.classList.remove('text-ink-300');
            activeStamp.classList.add('text-cinnabar', 'opacity-80');
          }
        });
      });
    });
  </script>
