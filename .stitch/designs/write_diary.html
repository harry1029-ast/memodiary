<!-- BEGIN: InteractiveHandlers -->
<script data-purpose="prompt-interaction">
    document.addEventListener('DOMContentLoaded', () => {
      const textarea = document.getElementById('diary-input');
      const usePromptBtn = document.querySelector('[data-purpose="thought-spark-card"] button:last-child');
      
      if (usePromptBtn && textarea) {
        usePromptBtn.addEventListener('click', () => {
          const promptQuote = '【灵感拾遗】记录下一件让你觉得微小却真切的幸福：\n\n';
          if (!textarea.value.includes('【灵感拾遗】')) {
            textarea.value = promptQuote + textarea.value;
            textarea.focus();
            textarea.setSelectionRange(textarea.value.length, textarea.value.length);
          }
        });
      }
    });
  </script>
<!-- END: InteractiveHandlers -->
