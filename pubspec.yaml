name: memodiary
description: "A local-first, privacy-focused multimodal diary application."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Local Encrypted Storage & Database
  drift: ^2.24.0
  drift_flutter: ^0.2.4
  sqlcipher_flutter_libs: ^0.6.4
  sqlite3: ^2.5.0

  # Key Storage, Security & Biometrics
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  crypto: ^3.0.6

  # Media Sandbox & Files
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  flutter_image_compress: ^2.4.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.24.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true