name: memodiary
description: "A local-first, privacy-focused multimodal diary application."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Local Encrypted Storage & Database
  drift: ^2.24.0
  sqlcipher_flutter_libs: ^0.6.4
  sqlite3: ^2.5.0

  # Key Storage, Security & Biometrics
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  crypto: ^3.0.6

  # Media Sandbox & Files
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  flutter_image_compress: ^2.4.0
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  file_picker: ^11.0.3
  video_player: ^2.9.2

  # Rich Text Editor & Multimodal Input
  flutter_quill: ^11.6.0
  speech_to_text: ^7.5.0
  intl: ^0.20.2
  share_plus: ^12.0.2

  # PDF Generation & High-Fidelity Print Engine (100% FOSS)
  pdf: ^3.11.1
  printing: ^5.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.24.0
  build_runner: ^2.4.15
  video_player_platform_interface: ^6.9.0
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true